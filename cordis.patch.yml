# dsh-load-agent-rules: load Cursor / Copilot / Windsurf / Cline / Kiro / Roo / Gemini rules.
# To change settings, add a row like the one below to
# ~/.dsh/profiles/<profile>/cordis.patch.yml (one profile) or ~/.dsh/cordis.patch.yml
# (every profile). Keys you leave out keep their defaults.
#
# - id: load-agent-rules
#   config:
#     sources: [cursor, copilot, windsurf, cline, kiro, roo, gemini, junie]
#     maxBaselineBytes: 48000
#     maxAttachBytes: 24000
#     toolName: project_rule      # '' to not register the reader tool
- insert:
    - id: load-agent-rules
      name: dsh-load-agent-rules
